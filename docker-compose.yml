services:
  db:
    image: mysql:8.0
    container_name: inventario2_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootPass_Cambia1!
      MYSQL_DATABASE: inventario2
      MYSQL_USER: almacen_local
      MYSQL_PASSWORD: CambiaEstaPassword1!
      TZ: Europe/Madrid
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inventario2_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pRootPass_Cambia1!"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  app:
    image: inventario2_app:latest
    container_name: inventario2_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8085:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: inventario2
      DB_USER: almacen_local
      DB_PASS: CambiaEstaPassword1!
      TZ: Europe/Madrid
    volumes:
      - app_data:/var/www/html
    networks:
      - inventario2_net

volumes:
  db_data:
    driver: local
  app_data:
    driver: local

networks:
  inventario2_net:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  author: IES Miguel de Molinos
  category: Utilities
  icon: https://raw.githubusercontent.com/zpma82/inventario2/main/app/icon.png
  title:
    en_us: Inventario Taller v2
    es_es: Inventario Taller v2
  tagline:
    en_us: Workshop inventory management
    es_es: Gestión de inventario para taller
  description:
    en_us: Complete inventory management system for workshop equipment
    es_es: Sistema completo de gestión de inventario para equipos del taller
  website: https://github.com/zpma82/inventario2
  port_map: "8085"
  scheme: http
  index: /
